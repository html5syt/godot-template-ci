name: 🔗 GHA
on:
  workflow_dispatch:
    inputs:
      build_profile:
        description: 'Path to custom build profile (e.g. /build.gdbuild)'
        required: true
        default: '/build.gdbuild'
        type: string

concurrency:
  group: ${{ github.workflow }}|${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # First stage: Only static checks, fast and prevent expensive builds from running.

  static-checks:
    if: ${{ !vars.DISABLE_GODOT_CI || github.run_attempt > 1 || github.event_name == 'workflow_dispatch' }}
    name: 📊 Static checks
    uses: ./.github/workflows/static_checks.yml

  # Second stage: Run all the builds and some of the tests.

  android-build:
    name: 🤖 Android
    needs: static-checks
    uses: ./.github/workflows/android_builds.yml
    with:
      build_profile: ${{ inputs.build_profile || '/build.gdbuild' }}

  ios-build:
    name: 🍏 iOS
    needs: static-checks
    uses: ./.github/workflows/ios_builds.yml
    with:
      build_profile: ${{ inputs.build_profile || '/build.gdbuild' }}

  linux-build:
    name: 🐧 Linux
    needs: static-checks
    uses: ./.github/workflows/linux_builds.yml
    with:
      build_profile: ${{ inputs.build_profile || '/build.gdbuild' }}

  macos-build:
    name: 🍎 macOS
    needs: static-checks
    uses: ./.github/workflows/macos_builds.yml
    with:
      build_profile: ${{ inputs.build_profile || '/build.gdbuild' }}

  windows-build:
    name: 🏁 Windows
    needs: static-checks
    uses: ./.github/workflows/windows_builds.yml
    with:
      build_profile: ${{ inputs.build_profile || '/build.gdbuild' }}

  web-build:
    name: 🌐 Web
    needs: static-checks
    uses: ./.github/workflows/web_builds.yml
    with:
      build_profile: ${{ inputs.build_profile || '/build.gdbuild' }}
