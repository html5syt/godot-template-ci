name: 🤖 Android Builds
on:
  workflow_call:
    inputs:
      build_profile:
        required: true
        default: 'build.gdbuild'
        type: string
  workflow_dispatch:
    inputs:
      build_profile:
        description: 'Path to custom build profile (e.g. build.gdbuild)'
        required: true
        default: 'build.gdbuild'
        type: string

# Global Settings
env:
  SCONS_FLAGS: >-
    production=yes
    tests=no
    swappy=yes

jobs:
  build-android:
    runs-on: ubuntu-24.04
    name: ${{ matrix.name }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Template Release arm64 (target=template_release, arch=arm64)
            cache-name: android-template-release-arm64
            target: template_release
            scons-flags: arch=arm64

          - name: Template Debug arm64 (target=template_debug, arch=arm64)
            cache-name: android-template-debug-arm64
            target: template_debug
            scons-flags: arch=arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download Swappy
        run: python ./misc/scripts/install_swappy_android.py

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }} build_profile=${{ inputs.build_profile }}
          platform: android
          target: ${{ matrix.target }}

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Generate Godot templates
        if: startsWith(matrix.target, 'template')
        run: |
          cd platform/android/java
          ./gradlew generateGodotTemplates
          cd ../../..
          ls -l bin/

      - name: Upload artifact
        if: startsWith(matrix.target, 'template')
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.cache-name }}
