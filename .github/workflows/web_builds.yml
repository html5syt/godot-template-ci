name: 🌐 Web Builds
on:
  workflow_call:
    inputs:
      build_profile:
        required: true
        default: 'build.gdbuild'
        type: string
  workflow_dispatch:
    inputs:
      build_profile:
        description: 'Path to custom build profile (e.g. build.gdbuild)'
        required: true
        default: 'build.gdbuild'
        type: string

# Global Settings
env:
  SCONS_FLAGS: >-
    production=yes
    tests=no
    debug_symbols=no
    use_closure_compiler=yes
  EM_VERSION: 4.0.11

jobs:
  web-template:
    runs-on: ubuntu-24.04
    name: ${{ matrix.name }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Template Release w/ threads (target=template_release, threads=yes)
            cache-name: web-template-release-threads
            target: template_release
            scons-flags: threads=yes
            artifact: true

          - name: Template Debug w/ threads (target=template_debug, threads=yes)
            cache-name: web-template-debug-threads
            target: template_debug
            scons-flags: threads=yes
            artifact: true

          - name: Template Release w/o threads (target=template_release, threads=no)
            cache-name: web-template-release-nothreads
            target: template_release
            scons-flags: threads=no
            artifact: true

          - name: Template Debug w/o threads (target=template_debug, threads=no)
            cache-name: web-template-debug-nothreads
            target: template_debug
            scons-flags: threads=no
            artifact: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Emscripten latest
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EM_VERSION }}
          no-cache: true

      - name: Verify Emscripten setup
        run: |
          emcc -v

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }} build_profile=${{ inputs.build_profile }}
          platform: web
          target: ${{ matrix.target }}

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        if: matrix.artifact
        with:
          name: ${{ matrix.cache-name }}
